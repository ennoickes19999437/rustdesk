name: Build Custom RustDesk Client

on:
  workflow_dispatch:  # Manuell starten per Knopfdruck

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          choco install nasm -y
          choco install llvm -y

      - name: Replace logo
        run: |
          copy /Y custom\icon.ico res\icon.ico
          copy /Y custom\icon.png res\icon.png
        shell: cmd
        continue-on-error: true

      - name: Set custom server
        run: |
          (Get-Content src\rendezvous_mediator.rs) `
            -replace 'rs-ny.rustdesk.com', '${{ secrets.RELAY_SERVER }}' |
          Set-Content src\rendezvous_mediator.rs
        shell: pwsh

      - name: Build
        run: cargo build --release

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom
          path: target\release\rustdesk.exe
