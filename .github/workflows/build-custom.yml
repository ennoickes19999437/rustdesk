name: Build Custom RustDesk Client

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          choco install nasm -y
          choco install llvm -y

      - name: Replace logo
        run: |
          copy /Y custom\icon.ico res\icon.ico
        shell: cmd
        continue-on-error: true

      - name: Set app name
        run: |
          (Get-Content Cargo.toml) -replace 'name = "rustdesk"', 'name = "Otterleicht-IT-Support"' |
          Set-Content Cargo.toml
        shell: pwsh

      - name: Set language to German
        run: |
          (Get-Content src\lang.rs -ErrorAction SilentlyContinue) `
            -replace '"en"', '"de"' |
          Set-Content src\lang.rs
        shell: pwsh
        continue-on-error: true

      - name: Set custom server
        run: |
          (Get-Content src\rendezvous_mediator.rs) `
            -replace 'rs-ny.rustdesk.com', '${{ secrets.RELAY_SERVER }}' |
          Set-Content src\rendezvous_mediator.rs
        shell: pwsh

      - name: Build
        run: cargo build --release

      - name: Rename output
        run: rename target\release\rustdesk.exe Otterleicht-IT-Support.exe
        shell: cmd

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom
          path: target\release\Otterleicht-IT-Support.exe
